<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Aouina-X</title>
<meta name="description" content="L'Aouina-X — المنصة العالمية للذاكرة والحكمة والقيم والوحدة">
<style>
:root{--bg:#0f1b2d;--bg2:#16263d;--card:#1b2f4b;--ink:#f4efe3;--muted:#b9c2d0;--gold:#d8b25a;--green:#4fb286;--line:#2b4467}
@media (prefers-color-scheme: light){
:root{--bg:#faf6ec;--bg2:#f1ead8;--card:#fffdf7;--ink:#1c2636;--muted:#566176;--gold:#a67c1f;--green:#1f7a57;--line:#ded3b8}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.8;font-size:17px}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.logo{font-weight:800;color:var(--gold);letter-spacing:.5px;font-size:20px;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:18px;overflow-x:auto;font-size:14px;white-space:nowrap;order:3;width:100%;padding-top:4px;border-top:1px solid var(--line);line-height:1.6}
nav a{flex:0 0 auto}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--gold)}
.lang{display:flex;gap:6px}
.lang button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:2px 9px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.hero{padding:64px 20px 56px;text-align:center;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%)}
.hero h1{margin:0;font-size:clamp(34px,8vw,60px);color:var(--gold)}
.hero h2{margin:6px 0 18px;font-weight:600;font-size:clamp(18px,4vw,26px)}
.hero p{max-width:640px;margin:0 auto 24px;color:var(--muted)}
.btn{display:inline-block;background:var(--gold);color:#111;padding:10px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:700}
section{padding:46px 18px;max-width:980px;margin:0 auto}
section>h3{font-size:26px;margin:0 0 6px;color:var(--gold)}
section>p.lead{margin:0 0 22px;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h4{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.band{background:var(--bg2)}
.assistant{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
#out{margin-top:14px;white-space:pre-wrap;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
ol.road{padding-inline-start:22px}
ol.road li{margin-bottom:8px}
footer{text-align:center;padding:34px 18px;color:var(--muted);border-top:1px solid var(--line);font-size:15px}
footer strong{color:var(--gold)}
</style>
</head>
<body>
<header>
  <a class="logo" href="#top">L'Aouina-X</a>
  <nav>
    <a href="#spaces" data-i18n="n1"></a>
    <a href="#shield" data-i18n="n2"></a>
    <a href="#assistant" data-i18n="n3"></a>
    <a href="#roadmap" data-i18n="n4"></a>
  </nav>
  <div class="lang">
    <button data-l="ar">ع</button><button data-l="fr">FR</button><button data-l="en">EN</button>
  </div>
</header>

<div class="hero" id="top">
  <h1>L'Aouina-X</h1>
  <h2 data-i18n="sub"></h2>
  <p data-i18n="slogan"></p>
  <a class="btn" href="#shield" data-i18n="cta"></a>
</div>

<section id="spaces">
  <h3 data-i18n="s_t"></h3>
  <p class="lead" data-i18n="s_l"></p>
  <div class="grid" id="spaceGrid"></div>
</section>

<div class="band">
<section id="shield">
  <h3 data-i18n="h_t"></h3>
  <p class="lead" data-i18n="h_l"></p>
  <div class="grid" id="shieldGrid"></div>
</section>
</div>

<section id="assistant">
  <h3 data-i18n="a_t"></h3>
  <p class="lead" data-i18n="a_l"></p>
  <div class="assistant">
    <textarea id="claim" data-ph="a_ph"></textarea>
    <p style="margin:12px 0 0"><button class="btn" id="check" data-i18n="a_b"></button></p>
    <div id="out"></div>
    <p class="note" data-i18n="a_n"></p>
  </div>
</section>

<div class="band">
<section id="roadmap">
  <h3 data-i18n="r_t"></h3>
  <ol class="road" id="roadList"></ol>
</section>
</div>

<footer>
  <p><strong data-i18n="f1"></strong></p>
  <p data-i18n="f2"></p>
</footer>

var lang="ar";
try{lang=localStorage.getItem("lx_lang")||"ar"}catch(e){}
if(!T[lang])lang="ar";
function card(h,p,i){return '<div class="card">'+(i!=null?'<span class="num">'+(i+1)+'</span>':'')+'<h4>'+h+'</h4><p>'+p+'</p></div>'}
function render(){
  var t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=t.dir;
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=t[e.getAttribute("data-i18n")]});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t[e.getAttribute("data-ph")]});
  document.getElementById("spaceGrid").innerHTML=t.spaces.map(function(s){return card(s[0],s[1])}).join("");
  document.getElementById("shieldGrid").innerHTML=t.shield.map(function(s,i){return card(s[0],s[1],i)}).join("");
  document.getElementById("roadList").innerHTML=t.road.map(function(r){return "<li>"+r+"</li>"}).join("");
  document.querySelectorAll(".lang button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===lang)});
  document.getElementById("out").textContent="";
}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){lang=b.getAttribute("data-l");try{localStorage.setItem("lx_lang",lang)}catch(e){}render()}});
document.getElementById("check").onclick=function(){
  var t=T[lang],v=document.getElementById("claim").value.trim(),o=document.getElementById("out");
  if(!v){o.textContent=t.a_e;return}
  o.textContent=t.a_h+"\n« "+v+" »\n\n"+t.checks.map(function(c,i){return (i+1)+". "+c}).join("\n");
};
render();
</script>
